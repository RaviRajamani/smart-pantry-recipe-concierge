<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Pantry & Recipe Concierge</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { 
    --accent: #e65100; 
    --accent-gradient: linear-gradient(135deg, #e65100, #f57c00); 
    --bg: #faf6f0; 
    --border: #fee4d2; 
    --text-dark: #2c3e50;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; color:var(--text-dark); }
  
  header { 
    background: var(--accent-gradient); 
    color: #fff; 
    padding: 1rem 1.5rem; 
    box-shadow: 0 4px 15px rgba(230,81,0,0.2); 
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  header .title { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: .5rem; }
  header .subtitle { font-size: .8rem; opacity: 0.9; font-weight: 400; }

  #log { 
    flex: 1; 
    overflow-y: auto; 
    padding: 1.5rem 1rem; 
    max-width: 820px; 
    width: 100%; 
    margin: 0 auto; 
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }
  
  /* Dialogue row styling */
  .msg { display: flex; gap: .75rem; align-items: flex-end; max-width: 88%; animation: fadeIn 0.25s ease-out; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.agent { align-self: flex-start; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    background: #fff;
  }
  .msg.user .avatar { background: #ffe0b2; color: var(--accent); }
  .msg.agent .avatar { background: #ffffff; border: 1px solid var(--border); }

  .bubble { 
    padding: .85rem 1.15rem; 
    border-radius: 18px 18px 18px 4px; 
    background: #ffffff; 
    border: 1px solid var(--border); 
    color: var(--text-dark);
    box-shadow: 0 3px 10px rgba(0,0,0,0.03); 
    line-height: 1.5;
    font-size: .95rem;
    max-width: 100%;
    white-space: pre-wrap; 
  }
  .msg.user .bubble { 
    background: var(--accent-gradient); 
    color: #fff; 
    border: none; 
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 3px 12px rgba(230,81,0,0.22);
    font-weight: 500;
  }
  /* When reply is an A2UI card, remove bubble container styling */
  .bubble.rich { background: transparent; border: none; padding: 0; box-shadow: none; white-space: normal; }

  /* Prompt suggestions */
  .suggestions { display:flex; gap:.6rem; padding:.6rem 1rem; max-width:820px; width:100%; margin:0 auto; overflow-x:auto; }
  .suggestion-btn { padding:.5rem .95rem; border:1px solid #fdba74; border-radius:20px; background:#fff; color:#c2410c; font-size:.85rem; font-weight:500; cursor:pointer; white-space:nowrap; transition:all .2s ease; box-shadow:0 2px 5px rgba(0,0,0,0.03); }
  .suggestion-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 8px rgba(230,81,0,0.2); }

  /* Input Form */
  form { display:flex; gap:.75rem; padding:1rem 1.25rem; border-top:1px solid var(--border); background:#ffffff; box-shadow:0 -4px 15px rgba(0,0,0,0.03); }
  input { flex:1; padding:.8rem 1.1rem; border:1px solid var(--border); border-radius:14px; font-size:1rem; background:#fffaf5; color:var(--text-dark); transition:all .2s; }
  input:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(230,81,0,0.15); }
  button[type="submit"] { padding:.8rem 1.4rem; border:none; border-radius:14px; background:var(--accent-gradient); color:#fff; font-weight:600; font-size:1rem; cursor:pointer; transition:all .2s; box-shadow:0 3px 10px rgba(230,81,0,0.25); }
  button[type="submit"]:hover { transform:translateY(-1px); box-shadow:0 5px 14px rgba(230,81,0,0.35); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid #fed7aa; border-radius:16px; padding:1.2rem; background:#ffffff; box-shadow:0 6px 18px rgba(230,81,0,0.06); max-width:100%; margin-top: .4rem; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.75rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.75rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.45; }
  .a2text.a2-h1 { font-size:1.45rem; font-weight:700; color:#9a3412; }
  .a2text.a2-h2 { font-size:1.2rem; font-weight:700; color:#c2410c; }
  .a2text.a2-h3 { font-size:1.05rem; font-weight:600; color:#ea580c; }
  .a2text.a2-h4 { font-size:0.95rem; font-weight:600; color:#475569; }
  .a2text.a2-caption { font-size:.85rem; color:#64748b; }
  .a2divider { border:none; border-top:1px solid #ffedd5; margin:.6rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:12px; display:block; box-shadow:0 4px 10px rgba(0,0,0,0.08); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<header>
  <div class="title">🍳 Smart Pantry & Recipe Concierge</div>
  <div class="subtitle">AI Culinary Assistant</div>
</header>
<div id="log">
  <div class="msg agent">
    <div class="avatar">🍳</div>
    <div class="bubble">Hello! 👋 I'm your <b>Smart Pantry & Recipe Concierge</b>. Ask me what to cook with your pantry ingredients, search online recipes, or create grocery shopping lists!</div>
  </div>
</div>
<div class="suggestions">
  <button type="button" class="suggestion-btn" onclick="sendPrompt('What can I cook with my current pantry items?')">🥦 What can I cook with my pantry?</button>
  <button type="button" class="suggestion-btn" onclick="sendPrompt('Search for chicken recipes on TheMealDB')">🍗 Search chicken recipes on TheMealDB</button>
  <button type="button" class="suggestion-btn" onclick="sendPrompt('Create a grocery shopping list for Spinach Omelette')">🛒 Create a grocery shopping list</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask something…" autocomplete="off" autofocus>
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const av = el("div", "avatar", who === "user" ? "👤" : "🍳");
  const b = el("div", "bubble");
  m.appendChild(av);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
